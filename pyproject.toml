[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sre-copilot"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "python-dotenv",
    "kafka-python",
    "redis",
    "httpx2",
    "httpx",
    "mcp>=2",
    "google-genai",
    "claude-agent-sdk>=0.2.152",
    "langgraph>=1.2.11",
    "langchain-google-genai",
    "langchain-google-vertexai",
    "flagembedding>=1.4.2",
    "sentence-transformers>=6.0.1",
    "psycopg[binary]>=3.3.5",
    "pgvector>=0.5.0",
    "ragas>=0.4.3,<0.5",
    "jsonref>=1.1.0",
    "observe-mcp-server",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
]

# Sibling checkout for now. Once github.com/amudhan023/observe-mcp-server
# exists, switch to: { git = "https://github.com/amudhan023/observe-mcp-server" }
[tool.uv.sources]
observe-mcp-server = { path = "../observe-mcp-server", editable = true }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
