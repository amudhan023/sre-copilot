[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sre-copilot"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "python-dotenv",
    "kafka-python",
    "redis",
    "httpx2",
    "httpx",
    "mcp>=2",
    "google-genai",
    "langgraph>=1.2.11",
    "langchain-google-genai",
    "flagembedding>=1.4.2",
    "sentence-transformers>=6.0.1",
    "psycopg[binary]>=3.3.5",
    "pgvector>=0.5.0",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
