global:
  resolve_timeout: 5m

route:
  # Group correlated symptoms into one incident for the agent.
  group_by: ["tenant", "service"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: sre-copilot

receivers:
  - name: sre-copilot
    webhook_configs:
      # Receiver runs on the host during local development.
      - url: http://host.docker.internal:8080/alerts
        send_resolved: true
