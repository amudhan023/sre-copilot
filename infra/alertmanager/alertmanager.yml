global:
  resolve_timeout: 5m

route:
  # One service incident can have several symptoms (latency, errors, etc.).
  # Group them so the agent investigates one incident instead of several pages.
  group_by: ["tenant", "service"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: sre-copilot

receivers:
  - name: sre-copilot
    webhook_configs:
      - url: http://localhost:8080/alerts
        send_resolved: true
