groups:
  - name: sre-copilot-service-health
    rules:
      - alert: ServiceHighLatency
        expr: |
          histogram_quantile(0.99,
            sum by (le, tenant, service) (
              rate(http_request_duration_seconds_bucket[5m])
            )
          ) > 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "p99 latency on {{ $labels.service }} exceeds 1s"
          description: "Tenant {{ $labels.tenant }} service {{ $labels.service }} has elevated p99 latency."

      - alert: ServiceHighErrorRate
        expr: |
          (
            sum by (tenant, service) (rate(http_requests_total{status=~"5.."}[5m]))
            /
            clamp_min(sum by (tenant, service) (rate(http_requests_total[5m])), 1)
          ) > 0.05
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "5xx error rate on {{ $labels.service }} exceeds 5%"
          description: "Tenant {{ $labels.tenant }} service {{ $labels.service }} has elevated server errors."

      - alert: ServiceHighCPU
        expr: |
          100 * avg by (tenant, service) (rate(process_cpu_seconds_total[5m])) > 80
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "CPU usage on {{ $labels.service }} exceeds 80%"
          description: "Tenant {{ $labels.tenant }} service {{ $labels.service }} has sustained high CPU."

      - alert: ServiceDatabaseErrors
        expr: |
          sum by (tenant, service) (rate(payment_api_database_errors_total[5m])) > 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Database errors on {{ $labels.service }} exceed 1/s"
          description: "Tenant {{ $labels.tenant }} service {{ $labels.service }} is seeing database errors."
